<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Hero Hub Tracker</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: #0a0a0c;
        color: #e8e8ec;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        padding: 24px;
        min-height: 100vh;
    }
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid #222;
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    h1 span { color: #ff4444; }
    .status {
        display: flex; align-items: center; gap: 8px;
        font-size: 13px; color: #888;
    }
    .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 8px #22c55e;
    }
    .dot.off { background: #444; box-shadow: none; }

    .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
    }
    .stat {
        background: #131316;
        border: 1px solid #1e1e22;
        border-radius: 10px;
        padding: 14px 16px;
    }
    .stat .label {
        font-size: 11px; color: #777;
        text-transform: uppercase; letter-spacing: 0.5px;
        margin-bottom: 6px;
    }
    .stat .value { font-size: 20px; font-weight: 700; }
    .stat .value.gold { color: #fbbf24; }
    .stat .value.green { color: #22c55e; }
    .stat .value.red { color: #ef4444; }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #131316;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #1e1e22;
    }
    thead { background: #1a1a1f; }
    th {
        padding: 12px 14px;
        text-align: right;
        font-size: 12px;
        font-weight: 600;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        user-select: none;
    }
    td {
        padding: 12px 14px;
        font-size: 13px;
        border-top: 1px solid #1e1e22;
    }
    tr:hover td { background: #1a1a1f; }

    .online { display: inline-flex; align-items: center; gap: 6px; }
    .online .dot { width: 8px; height: 8px; }

    .cash { color: #22c55e; font-weight: 600; }
    .bank { color: #fbbf24; font-weight: 600; }
    .level { color: #60a5fa; font-weight: 600; }

    .vehicles { max-width: 220px; font-size: 12px; color: #aaa; }
    .vehicles .tag {
        display: inline-block;
        background: #1e1e24;
        border: 1px solid #2a2a32;
        padding: 2px 8px;
        border-radius: 6px;
        margin: 2px;
        font-size: 11px;
    }

    .empty { text-align: center; padding: 60px 20px; color: #555; }
    .empty h2 { color: #777; margin-bottom: 8px; }
</style>
</head>
<body>

<header>
    <h1>HERO HUB <span>TRACKER</span></h1>
    <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">Connecting...</span>
    </div>
</header>

<div class="stats">
    <div class="stat">
        <div class="label">Total Players</div>
        <div class="value" id="sTotal">0</div>
    </div>
    <div class="stat">
        <div class="label">Online Now</div>
        <div class="value green" id="sOnline">0</div>
    </div>
    <div class="stat">
        <div class="label">Total Cash</div>
        <div class="value green" id="sCash">$0</div>
    </div>
    <div class="stat">
        <div class="label">Total Bank</div>
        <div class="value gold" id="sBank">$0</div>
    </div>
</div>

<table>
    <thead>
        <tr>
            <th>Status</th>
            <th>Username</th>
            <th>Level</th>
            <th>Cash</th>
            <th>Bank</th>
            <th>Vehicles</th>
            <th>Last Seen</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        <tr><td colspan="7" class="empty">
            <h2>Loading...</h2>
            <p>Waiting for players to connect</p>
        </td></tr>
    </tbody>
</table>

<script>
const API = window.location.origin;
const POLL_INTERVAL = 5000;

function fmtMoney(n) {
    if (n == null) return '$0';
    return '$' + Number(n).toLocaleString('en-US');
}

function timeAgo(ms) {
    const s = Math.floor((Date.now() - ms) / 1000);
    if (s < 5) return 'now';
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
}

function updateDashboard() {
    fetch(API + '/api/players')
        .then(r => r.json())
        .then(players => {
            let total = players.length;
            let online = players.filter(p => p.online).length;
            let totalCash = players.reduce((a, p) => a + (p.cash || 0), 0);
            let totalBank = players.reduce((a, p) => a + (p.bank || 0), 0);

            document.getElementById('sTotal').textContent = total;
            document.getElementById('sOnline').textContent = online;
            document.getElementById('sCash').textContent = fmtMoney(totalCash);
            document.getElementById('sBank').textContent = fmtMoney(totalBank);

            document.getElementById('dot').className = 'dot' + (online > 0 ? '' : ' off');
            document.getElementById('statusText').textContent =
                online + ' online · ' + total + ' total';

            const tbody = document.getElementById('tableBody');
            if (players.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty"><h2>No players yet</h2><p>Waiting...</p></td></tr>';
                return;
            }
            tbody.innerHTML = players.map(p => `
                <tr>
                    <td>
                        <span class="online">
                            <span class="dot ${p.online ? '' : 'off'}"></span>
                            ${p.online ? 'Online' : 'Offline'}
                        </span>
                    </td>
                    <td><strong>${p.username}</strong></td>
                    <td class="level">${p.level}</td>
                    <td class="cash">${fmtMoney(p.cash)}</td>
                    <td class="bank">${fmtMoney(p.bank)}</td>
                    <td class="vehicles">
                        ${(p.vehicles || []).length > 0
                            ? p.vehicles.map(v => '<span class="tag">' + v + '</span>').join('')
                            : '<span style="color:#555">—</span>'}
                    </td>
                    <td style="color:#777;font-size:12px">${timeAgo(p.lastSeen)}</td>
                </tr>
            `).join('');
        })
        .catch(err => {
            document.getElementById('dot').className = 'dot off';
            document.getElementById('statusText').textContent = 'Connection lost';
            console.error('Fetch error:', err);
        });
}

updateDashboard();
setInterval(updateDashboard, POLL_INTERVAL);
</script>
</body>
</html>
